# WEB roster: core 8 + 7 = 15. Contract surface (QUALITY); consumer bot-02-web-edge.
version: 1.0.0
seat: bot-02-web-edge
short: web
endpoint: /mcp/web
scope: seat:web
memory_banks: { own: pd-web, shared: [pd-desk] }
core: true
consumers: [bot-02-web-edge]
tools:
  - name: desk_lsp_diagnostics
    kind: read
    gates: []
    description: Diagnostics for one file from the Tier-1 unified LSP broker (tsjs, python, go).
    backend: systems.lsp_diagnostics
    input:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 300 }
        language: { type: string, enum: [tsjs, python, go, rust] }

  - name: desk_vercel_deployments
    kind: read
    gates: []
    description: List or inspect Vercel deployments for a desk-managed project.
    backend: web.vercel_deployments
    input:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,80}$" }
        deployment_id: { type: string, pattern: "^dpl_[A-Za-z0-9]+$" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }

  - name: desk_vercel_promote
    kind: write
    gates: [g5]
    description: Promote a deployment to production. PD-5 - requires rollback_plan and approval_id, both echoed into the audit event.
    backend: web.vercel_promote
    input:
      type: object
      additionalProperties: false
      required: [project, deployment_id, rollback_plan, approval_id]
      properties:
        project: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,80}$" }
        deployment_id: { type: string, pattern: "^dpl_[A-Za-z0-9]+$" }
        rollback_plan: { type: string, minLength: 20, maxLength: 4000 }
        approval_id: { type: string, minLength: 6, maxLength: 120 }

  - name: desk_vercel_rollback
    kind: write
    gates: [g5]
    description: Roll production back to a previous deployment. Requires approval_id.
    backend: web.vercel_rollback
    input:
      type: object
      additionalProperties: false
      required: [project, deployment_id, approval_id, rollback_plan]
      properties:
        project: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,80}$" }
        deployment_id: { type: string, pattern: "^dpl_[A-Za-z0-9]+$" }
        approval_id: { type: string, minLength: 6, maxLength: 120 }
        rollback_plan: { type: string, minLength: 20, maxLength: 4000 }
        reason: { type: string, maxLength: 1000 }

  - name: desk_preview_check
    kind: read
    gates: []
    description: Fetch a preview URL and record status, latency and a body hash as evidence. Does not follow off-host redirects.
    backend: web.preview_check
    input:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, pattern: "^https://", maxLength: 500 }
        expect_status: { type: integer, minimum: 100, maximum: 599, default: 200 }

  - name: desk_bundle_secret_scan
    kind: read
    gates: []
    description: Run the G-3 secret scanner over build output paths inside the repo checkout.
    backend: web.bundle_secret_scan
    input:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 300 }

  - name: desk_contract_ack
    kind: write
    gates: []
    description: Acknowledge or reject a contract change as this seat (G-4). A rejection must name the blocker.
    backend: quality.contract_ack
    input:
      type: object
      additionalProperties: false
      required: [change_id, ack, note]
      properties:
        change_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,80}$" }
        ack: { type: boolean }
        note: { type: string, minLength: 5, maxLength: 2000 }
