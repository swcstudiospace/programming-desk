# IOS roster: core 8 + 7 own = 15. Contract surface (QUALITY); consumer bot-04-ios.
# NOTE (SPE-5161 QUALITY companion, bot-06-quality-security): the 8 local/MetaVR tools added
# for SPE-5161 / PR #48 (bot-04-ios/spe-5161-ios-tools-metavr) would have put this roster at 23
# effective tools against ci/gates/check_desk_integrity.py's ROSTER_MAX_TOOLS=15 ceiling (G-7).
# Resolved by moving them out of the permanent roster into two tool-packs instead of raising the
# ceiling: contracts/tool-packs/ios-local.yaml (5 filesystem-only tools, app ioslocal) and
# contracts/tool-packs/ios-metavr.yaml (3 MetaVR device tools, app iosmetavr). ios seats load
# either via desk_app_tools_load for the life of one ticket. See
# contracts/changes/spe-5161-ios-local-tools-v1.1.0.yaml for the full change record, including a
# second, still-open blocker: services/desk-gateway has no ios.py backend module, so calling
# any of these tools today raises ModuleNotFoundError (bot-01-systems-backend's to fix).
version: 1.1.0
seat: bot-04-ios
short: ios
endpoint: /mcp/ios
scope: seat:ios
memory_banks: { own: pd-ios, shared: [pd-desk] }
core: true
packs_allowed: true
consumers: [bot-04-ios]
tools:
  - name: desk_testflight_status
    kind: read
    gates: []
    description: Read TestFlight and App Store Connect state for a desk-managed app (builds, processing, review state).
    backend: mobile.testflight_status
    input:
      type: object
      additionalProperties: false
      required: [bundle_id]
      properties:
        bundle_id: { type: string, pattern: "^[A-Za-z0-9.-]{3,160}$" }
        build: { type: string, maxLength: 40 }

  - name: desk_appstore_phased_release
    kind: write
    gates: [g5, g6]
    description: >-
      Start a phased release for an approved version. PD-5 - requires rollback_plan, a halt_signal that
      names a metric and an approval_id. A phased release can be paused, not recalled.
    backend: mobile.appstore_phased_release
    input:
      type: object
      additionalProperties: false
      required: [bundle_id, version, halt_signal, rollback_plan, approval_id]
      properties:
        bundle_id: { type: string, pattern: "^[A-Za-z0-9.-]{3,160}$" }
        version: { type: string, pattern: "^[0-9]+(\\.[0-9]+){1,3}$" }
        halt_signal: { type: string, minLength: 10, maxLength: 500 }
        rollback_plan: { type: string, minLength: 20, maxLength: 4000 }
        approval_id: { type: string, minLength: 6, maxLength: 120 }

  - name: desk_appstore_pause_release
    kind: write
    gates: [g6]
    description: Pause a phased release. Requires approval_id and a reason.
    backend: mobile.appstore_pause_release
    input:
      type: object
      additionalProperties: false
      required: [bundle_id, version, reason, approval_id]
      properties:
        bundle_id: { type: string, pattern: "^[A-Za-z0-9.-]{3,160}$" }
        version: { type: string, pattern: "^[0-9]+(\\.[0-9]+){1,3}$" }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        approval_id: { type: string, minLength: 6, maxLength: 120 }

  - name: desk_entitlements_diff
    kind: read
    gates: []
    description: Diff Info.plist and .entitlements files between two refs; the entitlement paragraph of every iOS report.
    backend: mobile.entitlements_diff
    input:
      type: object
      additionalProperties: false
      required: [base_ref, head_ref]
      properties:
        base_ref: { type: string, minLength: 1, maxLength: 120 }
        head_ref: { type: string, minLength: 1, maxLength: 120 }
        target_dir: { type: string, pattern: "^ios(/[A-Za-z0-9._-]+)*$", default: ios }

  - name: desk_review_risk_check
    kind: read
    gates: []
    description: Evaluate the App Review checklist (permissions, usage strings, StoreKit, account deletion, private API markers) against a diff.
    backend: mobile.review_risk_check
    input:
      type: object
      additionalProperties: false
      required: [base_ref, head_ref]
      properties:
        base_ref: { type: string, minLength: 1, maxLength: 120 }
        head_ref: { type: string, minLength: 1, maxLength: 120 }

  - name: desk_contract_ack
    kind: write
    gates: []
    description: Acknowledge or reject a contract change as this seat (G-4). A rejection must name the blocker.
    backend: quality.contract_ack
    input:
      type: object
      additionalProperties: false
      required: [change_id, ack, note]
      properties:
        change_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,80}$" }
        ack: { type: boolean }
        note: { type: string, minLength: 5, maxLength: 2000 }

  - name: desk_app_tools_load
    kind: write
    gates: []
    description: Load or unload an application tool pack (contracts/tool-packs/<app>.yaml) for the life of one ticket.
    backend: packs.app_tools_load
    input:
      type: object
      additionalProperties: false
      required: [app, task_id]
      properties:
        app: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$" }
        task_id: { type: string, minLength: 3, maxLength: 120 }
        unload: { type: boolean, default: false }
