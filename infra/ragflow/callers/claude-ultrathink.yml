# Copy to .github/workflows/ragflow-ingest.yml in swcstudiospace/claude-ultrathink.
# Callers need permission to use this public reusable workflow, and the two
# secrets below on the caller repository. Empty secrets make the job a no-op.

name: RAGFlow ingest

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ingest:
    uses: swcstudiospace/programming-desk/.github/workflows/ragflow-ingest.yml@main
    secrets:
      RAGFLOW_URL: ${{ secrets.RAGFLOW_URL }}
      RAGFLOW_API_KEY: ${{ secrets.RAGFLOW_API_KEY }}
    with:
      repo: claude-ultrathink
