# Change document for the android.tools local/MetaVR bridge tool roster addition.
#
# Verify before opening the pull request:
#   python3 ci/gates/check_contracts.py --base origin/main \
#       --change contracts/changes/spe-5160-android-local-tools-v1.1.0.yaml

change_id: spe-5160-android-local-tools-v1.1.0
proposed_by: bot-06-quality-security

surface: contracts/tool-rosters/android.yaml

breaking: false
version: 1.1.0
previous_version: 1.0.0

summary: >
  Additive local android.tools from SPE-5160/#47 (bot-03-android/spe-5160-android-tools-metavr,
  tip a38454de). Appends nine desk_android_* tools to the ANDROID seat roster wrapping
  android/tools: emu_boot, adb_devices, install_apk (g6), unit_test, instrumented_run,
  logcat_capture, screenshot, ui_dump and ui_tap (the last two MetaVR-primary wraps that resolve
  a documented tool id rather than calling MCP directly). No existing tool, field or endpoint is
  renamed, removed or reinterpreted; the roster grows from 7 to 16 seat tools (24 with the core
  eight).

# Resolved from ownership.yaml -> contract_consumers["contracts/tool-rosters/**"]. Every seat is
# a consumer of every roster file; listed here only to make the reviewed scope legible.
consumers_required:
  - bot-00-programming-lead
  - bot-01-systems-backend
  - bot-02-web-edge
  - bot-03-android
  - bot-04-ios
  - bot-05-infrastructure
  - bot-06-quality-security

# Required field. No existing field's name or type changed, so no field changed meaning.
semantic_changes: []

# Empty on purpose. Non-breaking: acknowledgements are informational here (a rejection would
# still block), and no consumer has been asked yet. A rejection blocks this non-breaking change
# the same way; see check_contracts.py.
acknowledgements: []

notes:
  - "No migration_note: not required for a non-breaking change, and there is nothing to migrate
    — every new tool is additive."
  - "Out of scope: android/** (owned by bot-03-android, not touched here), gateway wiring,
    Path B receipt stamping, PR #40, and the iOS roster."
