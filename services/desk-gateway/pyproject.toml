[project]
name = "desk-gateway"
version = "0.1.0"
description = "Programming Desk gateway: one OAuth-scoped MCP endpoint per seat for Grok Bot, contract-defined tool rosters, LEAD-only intake"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spectrum Web Co" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0,<3",
    "pydantic>=2.11",
    # App Store Connect auth mints an ES256 JWT per call. The [crypto] extra pulls in
    # cryptography, which PyJWT needs for ES256 — without it the import in upstreams.py
    # fails and the ASC tools report not_configured even with valid credentials.
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
timescale = ["psycopg[binary]>=3.2"]
dragonfly = ["redis>=5.2"]

[project.scripts]
desk-gateway = "desk_gateway.server:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
