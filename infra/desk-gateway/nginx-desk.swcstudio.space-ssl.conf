# desk.swcstudio.space — HTTPS. Everything is proxied to the gateway on 127.0.0.1:8791:
# /mcp/<seat>, the OAuth routes (/authorize /token /.well-known/oauth-*; /register is closed here),
# /oauth/consent, /health, POST /v1/intake, the live desk view (/, /view/*) and its
# WebSocket feed (/desk/events). Auth is the gateway's job. nginx adds only the passphrase rate limit
# on /authorize and /oauth/consent, and restores the client address from Cloudflare.
#
# This vhost references the certbot files, so nginx -t fails until the certificate exists.
# install-nginx.sh only enables it once /etc/letsencrypt/live/desk.swcstudio.space/ is present.
#

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name desk.swcstudio.space;
    # Cloudflare fronts this vhost. Restore the client address from CF-Connecting-IP only for
    # Cloudflare's published ranges (snippets/cloudflare-realip.conf).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/desk.swcstudio.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.swcstudio.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:desk_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Intake bodies and MCP tool calls are small; anything larger is not a legitimate client.
    client_max_body_size 2m;

    # Live desk view feed. A viewer keeps this socket open for as long as the page is open;
    # the gateway pings every 20 s, which also keeps Cloudflare's idle timer from closing it.
    location = /desk/events {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Dynamic client registration lets a caller mint fresh passphrase-attempt counters (programming-desk audit). Closed at the edge.
    location = /register {
        return 404;
    }

    # Passphrase attempts (authorize and consent) share one budget per real client address.
    location = /authorize {
        limit_req zone=desk_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /oauth/consent {
        limit_req zone=desk_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # The view login is a second passphrase check, throttled by the app per client address.
    location = /view/login {
        limit_req zone=desk_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;

        # Bearer tokens (OAuth) and the per-seat smoke-test key. nginx forwards them by
        # default; they are set explicitly so a later auth_basic or header rewrite cannot
        # silently strip them.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-connector-key $http_x_connector_key;

        # 30 s sits above the gateway's 20 s per-call deadline (plan §7.1). An idle MCP
        # event-stream is closed at 30 s and the client reconnects; that is accepted.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # MCP streamable HTTP answers as text/event-stream; buffering would hold events
        # until the response ends.
        proxy_buffering off;
    }
}
