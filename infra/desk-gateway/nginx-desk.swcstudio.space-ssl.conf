# desk.swcstudio.space — HTTPS. Everything is proxied to the gateway on 127.0.0.1:8791:
# /mcp/<seat>, the OAuth routes (/authorize /token /register /.well-known/oauth-*),
# /oauth/consent, /health and POST /v1/intake. Auth is the gateway's job; nginx adds nothing.
#
# This vhost references the certbot files, so nginx -t fails until the certificate exists.
# install-nginx.sh only enables it once /etc/letsencrypt/live/desk.swcstudio.space/ is present.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name desk.swcstudio.space;

    ssl_certificate     /etc/letsencrypt/live/desk.swcstudio.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.swcstudio.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:desk_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Intake bodies and MCP tool calls are small; anything larger is not a legitimate client.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bearer tokens (OAuth) and the per-seat smoke-test key. nginx forwards them by
        # default; they are set explicitly so a later auth_basic or header rewrite cannot
        # silently strip them.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-connector-key $http_x_connector_key;

        # 30 s sits above the gateway's 20 s per-call deadline (plan §7.1). An idle MCP
        # event-stream is closed at 30 s and the client reconnects; that is accepted.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # MCP streamable HTTP answers as text/event-stream; buffering would hold events
        # until the response ends.
        proxy_buffering off;
    }
}
