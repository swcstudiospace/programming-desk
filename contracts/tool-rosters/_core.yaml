# Shared core roster. Every seat endpoint serves these eight tools in addition to its own.
# Contract surface (QUALITY). Breaking changes follow G-4; every seat is a consumer.
#
# Conventions used by every roster file:
#   kind:   read  — never mutates a system of record; fails open (empty result + reason)
#           write — mutates; fails closed
#   gates:  g5 — deployment-class tool: rollback_plan and approval_id are required inputs
#           g6 — destructive-class tool: approval_id is required and echoed into the audit event
#   backend: the gateway module and function that implements the tool
#
# 1.1.0 records agent-substrate 91487e7 (#59), 9231f43 (#60) and 1e5e719 (#62) against the
# tools the gateway already implements (services/desk-gateway). No tool was added. Capabilities
# that need gateway code are follow-ups in contracts/changes/rosters-substrate-railway.yaml.
version: 1.1.0
surface: contracts/tool-rosters/_core.yaml
tools:
  - name: desk_brief
    kind: read
    gates: []
    description: >-
      Start-of-turn brief for this seat: substrate memory brief for the Graph ID, recall from the
      seat bank and the shared desk bank, and the seat's open tickets. Cached for five minutes.
      agent-substrate 9231f43 (#60) reads open graphs in two round trips (one graph_index select
      and one batched graph_nodes select). Release 91487e7 (#59) spent the 1,200 ms brief budget
      on one nodes query per open graph, so those briefs came back degraded. This tool still has
      no etag, profile, or If-None-Match input; 91487e7's brief fast path is not a roster field.
    backend: core.brief
    input:
      type: object
      additionalProperties: false
      properties:
        graph_id: { type: string, pattern: "^ut-[a-z0-9]+-[0-9a-f]{8}$" }
        task_id: { type: string, maxLength: 120 }
        refresh: { type: boolean, default: false }

  - name: desk_docs_search
    kind: read
    gates: []
    description: >-
      Search the desk document datasets (programming-desk, agent-substrate, and the repo named in
      the ticket). Returns chunks with source paths and commits. When RAGFlow is configured the
      gateway calls RAGFlow; it does not call a substrate docs_search tool. agent-substrate
      91487e7 (#59, R6) documents RAGFlow dataset pins on the server, and 1e5e719 (#62, S7) adds
      a docs-freshness SLI, trigger-lag detection and an opt-in golden canary. Those are not
      fields on this tool. A chunk is not a repository fact until the file is opened, and this
      tool does not report freshness.
    backend: core.docs_search
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 500 }
        repo: { type: string, pattern: "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)?$" }
        limit: { type: integer, minimum: 1, maximum: 20, default: 8 }

  - name: desk_memory_retain
    kind: write
    gates: []
    description: >-
      Retain a decision, verified command, environment fact or gotcha into this seat's memory bank.
      Refused without a receipt_path or a source URL. Content is redacted before it leaves the gateway.
      agent-substrate 91487e7 (#59, R3) keeps a durable Hindsight retain outbox on the server. This
      gateway still calls Hindsight retain and substrate memory_write itself; it does not enqueue
      that outbox. partial means one plane stored and another did not.
    backend: core.memory_retain
    input:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 8, maxLength: 8000 }
        receipt_path: { type: string, pattern: "^\\.receipts/bot-0[0-6]-[a-z-]+/[A-Za-z0-9._-]+\\.json$" }
        source: { type: string, format: uri, maxLength: 500 }
        graph_id: { type: string, pattern: "^ut-[a-z0-9]+-[0-9a-f]{8}$" }
        task_id: { type: string, maxLength: 120 }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }

  - name: desk_memory_recall
    kind: read
    gates: []
    description: >-
      Recall from this seat's bank and the shared desk bank (LEAD also reads pd-lead-reports).
      agent-substrate 91487e7 (#59, R3) bounds recall budgets on the server. This tool's per-bank
      timeout is unchanged, and a timed-out bank is reported rather than replaced with an empty list.
    backend: core.memory_recall
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 500 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 8 }
        include_shared: { type: boolean, default: true }

  - name: desk_ownership_resolve
    kind: read
    gates: []
    description: >-
      Resolve repo-relative paths to their owning seat under ownership.yaml at origin/main (last
      match wins; unowned is reported as such). Run before the first edit.
    backend: core.ownership_resolve
    input:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 300 }

  - name: desk_receipt_check
    kind: read
    gates: []
    description: >-
      Run the G-2, G-3, G-5 and G-6 gate scripts against a receipt without writing anything to git.
      Returns each gate's exit code and output tail.
    backend: core.receipt_check
    input:
      type: object
      additionalProperties: false
      required: [bot]
      properties:
        bot: { type: string, pattern: "^bot-0[0-6]-[a-z-]+$" }
        receipt: { type: object }
        receipt_path: { type: string, pattern: "^\\.receipts/bot-0[0-6]-[a-z-]+/[A-Za-z0-9._-]+\\.json$" }
        strict: { type: boolean, default: true }

  - name: desk_event_emit
    kind: write
    gates: []
    description: >-
      Emit a seat-attributed event to the substrate event log (GreptimeDB). Payloads are redacted
      and capped at 4 KB. agent-substrate 1e5e719 (#62, S6) also stores TTL'd metric_samples and
      serves a bounded /slo/history. This tool does not write or read that history.
    backend: core.event_emit
    input:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, pattern: "^[a-z][a-z0-9_.]{2,60}$" }
        graph_id: { type: string, pattern: "^ut-[a-z0-9]+-[0-9a-f]{8}$" }
        task_id: { type: string, maxLength: 120 }
        payload: { type: object }

  - name: desk_doctor
    kind: write
    gates: []
    description: >-
      Desk integrity: check verifies prompt SHA, skills, memory bank, tool roster, connector and
      roster registration; register records this Bot's agent UUID (and, for LEAD, the channel id);
      install_prompt returns the assembled prompt for this seat with the roster filled in; repair
      re-runs install_prompt. Doctor never edits a gate, a receipt or another seat's files.
    backend: core.doctor
    input:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [check, register, install_prompt, repair] }
        agent_uuid: { type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        channel_id: { type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        prompt_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        installed_skills: { type: array, maxItems: 100, items: { type: string, maxLength: 80 } }
