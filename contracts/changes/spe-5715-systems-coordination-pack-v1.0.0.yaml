    three rejection reasons (lost, expired, unheld), not just expired, via
    test_coordination_graph_heartbeat_rejected_lease_is_a_failed_call."
  - "Greptile P2s (PR #59, this round): Issues 3-5 (coordination-drift-smoke.py registration
    ordering, attributable-findings strictness, concurrent-claim proof) are left unaddressed here
