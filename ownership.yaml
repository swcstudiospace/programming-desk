# Path ownership manifest.
#
# Every file in the repository resolves to EXACTLY ONE owning bot. This is what makes a
# platform/domain decomposition workable: without it, a single feature touching mobile, API and
# infrastructure has three bots editing the same branch with no clear authority, and the last
# writer wins by accident rather than by decision.
#
# Rules:
#   - Patterns are gitignore-style globs, matched against repo-relative paths.
#   - LAST matching pattern wins, so put general rules first and specific overrides after.
#   - A path matching nothing is UNOWNED, and ci/gates/check_ownership.py fails the build.
#     Unowned files are not a minor lint problem: they are the exact places where two bots
#     silently collide.
#   - A bot may only modify paths it owns. Cross-bot work goes through the contract-first
#     protocol in docs/cross-bot-protocol.md.
#
# Validate:  python3 ci/gates/check_ownership.py --validate-manifest

version: 1

bots:
  bot-00-programming-lead:
    name: Programming Lead
    description: >
      Desk orchestrator. Intake, tickets, dispatch, consolidation, user reporting.
      Does not own product code. Sits in the Programming Desk channel. QUALITY is
      off-channel for post-build merge-gate.

  bot-01-systems-backend:
    name: Systems & Design
    languages: [rust, python]
    description: >
      Services, APIs, data layer, performance-critical code, and product/system design
      artifacts (flows, component specs, design tokens consumed by clients).

  bot-02-web-edge:
    name: Web & Desktop
    languages: [typescript, javascript]
    runtimes: [deno, node, vercel-edge, electron, tauri]
    description: >
      Browser frontend, edge functions, Vercel surface, and desktop shells (Electron/Tauri).

  bot-03-android:
    name: Android & Play Release
    languages: [kotlin, java]
    description: >
      Android application, Compose UI, Gradle build, Play Console, staged rollout, and store listing.
      Play release files live under android/.

  bot-04-ios:
    name: iOS & App Store
    languages: [swift, objective-c]
    description: >
      iOS application, SwiftUI, Xcode project, App Store Connect, TestFlight, and App Review.
      App Store files live under ios/.

  bot-05-infrastructure:
    name: Infra & WEB3
    languages: [hcl, yaml, bash, solidity]
    description: >
      IaC, Kubernetes, CI/CD, remote dev, observability, plus WEB3 ops (RPC, wallets, chain deploys,
      indexer/infra). Protobuf files stay with QUALITY even under web3/ or chains/.

  bot-06-quality-security:
    name: Quality & Security
    description: >
      Cross-cutting review, test strategy, secrets, supply chain, release gates.
      The only bot with READ access everywhere. Its write scope is deliberately narrow.

# ---------------------------------------------------------------------------
# Ownership
# ---------------------------------------------------------------------------
ownership:

  # --- Agent tooling config ----------------------------------------------
  # Project-scoped MCP server config consumed by Claude Cloud Sessions. It is remote-dev
  # wiring, not product code, so the root file sits with INFRA. Secrets stay out of it: the
  # committed config only references ${VAR} placeholders resolved from the session
  # environment.
  #
  # Placed FIRST on purpose. The resolver matches a slash-less pattern by basename at any
  # depth, and a pattern containing '/' can never match a path with no '/' in it, so there
  # is no way to spell "root only" for this filename. First position is the next best thing:
  # the root .mcp.json matches nothing else and stays INFRA, while a future web/.mcp.json or
  # android/.mcp.json is claimed by its directory rule below, because last match wins.
  - pattern: ".mcp.json"
    owner: bot-05-infrastructure

  # --- Backend / systems -------------------------------------------------
  - pattern: "services/**"
    owner: bot-01-systems-backend
  - pattern: "crates/**"
    owner: bot-01-systems-backend
  - pattern: "**/*.rs"
    owner: bot-01-systems-backend
  - pattern: "Cargo.toml"
    owner: bot-01-systems-backend
  - pattern: "Cargo.lock"
    owner: bot-01-systems-backend
  - pattern: "**/*.py"
    owner: bot-01-systems-backend
  - pattern: "pyproject.toml"
    owner: bot-01-systems-backend
  - pattern: "uv.lock"
    owner: bot-01-systems-backend
  - pattern: "migrations/**"
    owner: bot-01-systems-backend

  # --- Web / edge --------------------------------------------------------
  - pattern: "web/**"
    owner: bot-02-web-edge
  - pattern: "apps/web/**"
    owner: bot-02-web-edge
  - pattern: "edge/**"
    owner: bot-02-web-edge
  - pattern: "**/*.ts"
    owner: bot-02-web-edge
  - pattern: "**/*.tsx"
    owner: bot-02-web-edge
  - pattern: "package.json"
    owner: bot-02-web-edge
  - pattern: "deno.json"
    owner: bot-02-web-edge
  - pattern: "deno.lock"
    owner: bot-02-web-edge
  - pattern: "vercel.json"
    owner: bot-02-web-edge

  # --- Android -----------------------------------------------------------
  - pattern: "android/**"
    owner: bot-03-android
  - pattern: "**/*.kt"
    owner: bot-03-android
  - pattern: "**/*.kts"
    owner: bot-03-android
  - pattern: "**/build.gradle"
    owner: bot-03-android

  # --- iOS ---------------------------------------------------------------
  - pattern: "ios/**"
    owner: bot-04-ios
  - pattern: "**/*.swift"
    owner: bot-04-ios
  - pattern: "**/*.xcodeproj/**"
    owner: bot-04-ios
  - pattern: "**/Package.swift"
    owner: bot-04-ios

  # --- Infrastructure ----------------------------------------------------
  - pattern: "infra/**"
    owner: bot-05-infrastructure
  - pattern: "**/*.tf"
    owner: bot-05-infrastructure
  - pattern: "**/*.tfvars"
    owner: bot-05-infrastructure
  - pattern: "k8s/**"
    owner: bot-05-infrastructure
  - pattern: "deploy/**"
    owner: bot-05-infrastructure
  - pattern: "Dockerfile*"
    owner: bot-05-infrastructure
  - pattern: "docker-compose*.yml"
    owner: bot-05-infrastructure
  - pattern: ".github/workflows/**"
    owner: bot-05-infrastructure
  - pattern: "scripts/dev/**"
    owner: bot-05-infrastructure

  # --- Quality & security ------------------------------------------------
  # Narrow on purpose. Bot 6's authority is the gates and the review, not the code.
  - pattern: "ci/gates/**"
    owner: bot-06-quality-security
  - pattern: "ci/hooks/**"
    owner: bot-06-quality-security
  - pattern: ".pre-commit-config.yaml"
    owner: bot-06-quality-security
  - pattern: "SECURITY.md"
    owner: bot-06-quality-security
  - pattern: "ownership.yaml"
    owner: bot-06-quality-security

  # --- Shared contracts --------------------------------------------------
  # The interface surface between bots. Contract-first protocol applies: a change here
  # requires the consumer sign-off recorded in the receipt. See docs/cross-bot-protocol.md.
  - pattern: "contracts/**"
    owner: bot-06-quality-security
    contract_surface: true
  - pattern: "openapi.yaml"
    owner: bot-06-quality-security
    contract_surface: true
  # **/*.proto is restated after the dual-domain directory rules. Last match wins,
  # and a directory such as web3/** must not take contract_surface off a .proto file.

  # --- Verification receipts ---------------------------------------------
  # Every bot writes receipts, so a single shared .receipts/ would be a permanently
  # contended path. Per-bot subdirectories keep one owner per path and stop a bot
  # from editing another bot's evidence.
  - pattern: ".receipts/bot-00-programming-lead/**"
    owner: bot-00-programming-lead
  - pattern: ".receipts/bot-01-systems-backend/**"
    owner: bot-01-systems-backend
  - pattern: ".receipts/bot-02-web-edge/**"
    owner: bot-02-web-edge
  - pattern: ".receipts/bot-03-android/**"
    owner: bot-03-android
  - pattern: ".receipts/bot-04-ios/**"
    owner: bot-04-ios
  - pattern: ".receipts/bot-05-infrastructure/**"
    owner: bot-05-infrastructure
  - pattern: ".receipts/bot-06-quality-security/**"
    owner: bot-06-quality-security

  # --- Docs --------------------------------------------------------------
  - pattern: "docs/**"
    owner: bot-06-quality-security
  - pattern: "README.md"
    owner: bot-06-quality-security

  # --- Architecture + skills ------------------------------------------------
  # skills/** is the shared pack. More specific rules below reassign LEAD's
  # orchestration skills. Last matching pattern wins.
  - pattern: "ARCHITECTURE.md"
    owner: bot-06-quality-security
  - pattern: "skills/**"
    owner: bot-06-quality-security

  # --- Prompt sources (one seat per source file) ---------------------------
  - pattern: "prompts/_shared/**"
    owner: bot-06-quality-security
  - pattern: "prompts/bot-01-systems-backend.xml"
    owner: bot-01-systems-backend
  - pattern: "prompts/bot-02-web-edge.xml"
    owner: bot-02-web-edge
  - pattern: "prompts/bot-03-android.xml"
    owner: bot-03-android
  - pattern: "prompts/bot-04-ios.xml"
    owner: bot-04-ios
  - pattern: "prompts/bot-05-infrastructure.xml"
    owner: bot-05-infrastructure
  - pattern: "prompts/bot-06-quality-security.xml"
    owner: bot-06-quality-security
  # Assembled runtime copies are regenerated by scripts/assemble-prompts.sh.
  - pattern: "prompts-assembled/**"
    owner: bot-06-quality-security
  - pattern: "prompts/LEAD.xml"
    owner: bot-06-quality-security
  - pattern: "prompts/SYSTEMS.xml"
    owner: bot-06-quality-security
  - pattern: "prompts/WEB.xml"
    owner: bot-06-quality-security
  - pattern: "prompts/ANDROID.xml"
    owner: bot-06-quality-security
  - pattern: "prompts/IOS.xml"
    owner: bot-06-quality-security
  - pattern: "prompts/INFRA.xml"
    owner: bot-06-quality-security
  - pattern: "prompts/QUALITY.xml"
    owner: bot-06-quality-security

  # --- Lead orchestrator (narrow; last match wins over docs/** and skills/**)

  # LEAD owns intake orchestration, not product code. Pipeline docs and the
  # uplift/dispatch skills are that orchestration surface.
  - pattern: "docs/desk-operating-model.md"
    owner: bot-00-programming-lead
  - pattern: "docs/gotxcot-cloud-pipeline.md"
    owner: bot-00-programming-lead
  - pattern: "docs/github-sot-orchestration.md"
    owner: bot-00-programming-lead
  - pattern: "prompts/bot-00-programming-lead.xml"
    owner: bot-00-programming-lead
  - pattern: "skills/gotxcot-uplift/**"
    owner: bot-00-programming-lead
  - pattern: "skills/trackplan-dispatch/**"
    owner: bot-00-programming-lead
  - pattern: "vendor/ultrathink-policy/**"
    owner: bot-00-programming-lead
  - pattern: "docs/intake-e2e-runbook.md"
    owner: bot-00-programming-lead
  - pattern: "docs/vps-agent-bus.md"
    owner: bot-00-programming-lead
  - pattern: "skills/agent-bus/**"
    owner: bot-00-programming-lead

  # Shared skills and the Greptile gate stay with QUALITY (last match over any
  # broader skills rule that might be added later).
  - pattern: "skills/greptile-merge-gate/**"
    owner: bot-06-quality-security
  - pattern: "scripts/assemble-prompts.sh"
    owner: bot-06-quality-security

  # Dual-domain directories. Last match wins over earlier language globs and over docs/**.
  # Play release stays under android/** (ANDROID). App Store stays under ios/** (IOS).
  # QUALITY security stays on ci/gates, SECURITY.md, contracts, and **/*.proto below.
  - pattern: "design/**"
    owner: bot-01-systems-backend
  - pattern: "docs/design/**"
    owner: bot-01-systems-backend
  - pattern: "desktop/**"
    owner: bot-02-web-edge
  - pattern: "apps/desktop/**"
    owner: bot-02-web-edge
  - pattern: "electron/**"
    owner: bot-02-web-edge
  - pattern: "tauri/**"
    owner: bot-02-web-edge
  - pattern: "web3/**"
    owner: bot-05-infrastructure
  - pattern: "infra/web3/**"
    owner: bot-05-infrastructure
  - pattern: "chains/**"
    owner: bot-05-infrastructure
  # After every directory rule. web3/api.proto and chains/foo.proto stay QUALITY
  # contract_surface. Do not duplicate this pattern; validate-manifest rejects duplicates.
  - pattern: "**/*.proto"
    owner: bot-06-quality-security
    contract_surface: true

# ---------------------------------------------------------------------------
# Consumers of each contract surface.
# A breaking change to a contract requires an acknowledgement from every listed consumer
# before the gate passes. This is what stops a backend bot shipping a field rename that
# silently breaks the iOS client three weeks before anyone notices.
# ---------------------------------------------------------------------------
contract_consumers:
  "contracts/api/**":
    - bot-02-web-edge
    - bot-03-android
    - bot-04-ios
  "contracts/events/**":
    - bot-01-systems-backend
    - bot-02-web-edge
    - bot-05-infrastructure
  "openapi.yaml":
    - bot-02-web-edge
    - bot-03-android
    - bot-04-ios

