# Bandit config for the security PR gate (.github/workflows/security-pr.yml, SPE-5162).
# Invoked as: bandit -r services ci --ini ci/security/bandit.ini -lll -f sarif -o bandit.sarif
#
# -lll (set on the CLI, not here) raises the reported severity floor to HIGH only, so the PR
# gate fails on HIGH+ per SPE-5162 without drowning in LOW/MEDIUM noise on every PR.
[bandit]
exclude_dirs = tests,vendor,node_modules,.venv,venv,__pycache__,.git
