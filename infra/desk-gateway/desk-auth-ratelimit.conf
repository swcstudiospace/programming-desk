# Shared budget for passphrase attempts on the desk OAuth steps (/authorize and /oauth/consent).
# The key is the client address nginx restores from Cloudflare's CF-Connecting-IP in the desk vhost,
# so the budget follows the real client and not the Cloudflare edge address.
limit_req_zone $binary_remote_addr zone=desk_auth:10m rate=20r/m;
