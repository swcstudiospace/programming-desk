# Incremental RAGFlow ingest.
#
# programming-desk runs this on every push to main. agent-substrate, agent-swarm
# and claude-ultrathink call it (templates in infra/ragflow/callers/). The job
# needs contents: read. It also reads Actions run history on this job only, so
# a dropped pending run can still diff from the last successful ingest.
# RAGFLOW_URL and RAGFLOW_API_KEY are optional: when either is empty the job
# prints a notice and exits 0 before any fetch, so a pull request and a fork
# never need the secrets.
#
# pull_request is not a trigger. The script also refuses that event.

name: RAGFlow ingest

on:
  workflow_call:
    inputs:
      repo:
        description: Dataset name. Defaults to the calling repository's name.
        required: false
        type: string
        default: ""
    secrets:
      RAGFLOW_URL:
        required: false
      RAGFLOW_API_KEY:
        required: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ragflow-ingest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the repository to ingest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: repo

      - name: Checkout the ingest script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: swcstudiospace/programming-desk
          # Callers pin this file at main. A push in programming-desk checks out
          # that push's own commit. Neither ref is taken from the caller.
          ref: ${{ github.event_name == 'workflow_call' && 'main' || github.sha }}
          path: desk
          persist-credentials: false

      - name: Ingest changed documents
        env:
          RAGFLOW_URL: ${{ secrets.RAGFLOW_URL }}
          RAGFLOW_API_KEY: ${{ secrets.RAGFLOW_API_KEY }}
          EVENT_BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO_NAME: ${{ inputs.repo != '' && inputs.repo || github.event.repository.name }}
          REPO_SLUG: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${RAGFLOW_URL}" || -z "${RAGFLOW_API_KEY}" ]]; then
            echo "ragflow-ingest: RAGFLOW_URL or RAGFLOW_API_KEY is empty; skipping ingest"
            exit 0
          fi
          cd "$GITHUB_WORKSPACE/repo"
          BEFORE="${EVENT_BEFORE:-}"
          LAST="$(gh api --jq '.workflow_runs[0].head_sha // empty' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ragflow-ingest.yml/runs?status=success&branch=${BRANCH_NAME}&per_page=1" || true)"
          if [[ "${LAST}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git cat-file -e "${LAST}^{commit}" 2>/dev/null || git fetch --no-tags origin "${LAST}" || true
            if git merge-base --is-ancestor "${LAST}" HEAD 2>/dev/null; then
              BEFORE="${LAST}"
              echo "ragflow-ingest: comparing from the last successful ingest"
            fi
          fi
          if [[ -n "${BEFORE}" && ! "${BEFORE}" =~ ^0+$ && "${BEFORE}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || git fetch --no-tags origin "${BEFORE}" || {
              echo "ragflow-ingest: before commit is unavailable; listing the tree"
              BEFORE="0000000000000000000000000000000000000000"
            }
          fi
          python3 "$GITHUB_WORKSPACE/desk/infra/ragflow/ingest.py" \
            --repo "$REPO_NAME" \
            --repo-slug "$REPO_SLUG" \
            --branch "$BRANCH_NAME" \
            --root "$GITHUB_WORKSPACE/repo" \
            --before "${BEFORE:-}" \
            --after "${AFTER:-}"
