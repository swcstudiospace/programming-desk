    PR #58 already covers, not anything specific to graph_heartbeat or coord_drift_scan."
  - "PR #58 (LEAD, SPE-5715 gap report, draft, do-not-edit) is left untouched."
  - "Greptile P1 fix round (PR #59): both P1s are now resolved on this branch — Issue 1 via
    coordination.yaml's seats: [systems, lead] (above); Issue 2 (rejected heartbeat reported as
