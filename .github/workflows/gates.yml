# Quality gates — the live workflow for this repository.
#
# Gates are required status checks — they block the merge rather than merely reporting.
# A gate that can be merged past is a suggestion.
#
# The distributable template is ci/.github/workflows/gates.yml. GitHub Actions only reads
# workflows from .github/workflows at the repository root, so the template alone cannot
# attach a required check — this file is what runs.
#
# The two must not diverge. .github/workflows/gates-template-sync.yml compares everything
# below this comment block against the template and fails if they drift apart.
#
# Both jobs run on the organisation's self-hosted VPS runner, labelled
# [self-hosted, Linux, X64], because this organisation's GitHub-hosted minutes are blocked by a
# spending limit and hosted jobs die in seconds without reaching a gate. If that runner goes
# offline these checks do not fail — they sit queued, which as a required check presents as a
# pull request pending forever with no error to read. Check the runner before debugging a gate.
#
# Trust model (Greptile P1 4140823500): on pull_request, both jobs overlay ci/gates/
# from the PR base ref before any python3 ci/gates or pytest import of those modules.
# The PR tree is data only for gate script execution on the shared self-hosted runner.

name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    # Pull requests only. A push to main has no head ref, so the acting bot would resolve
    # to "main" and fail attribution before any gate ran — every push red, for a question
    # that is already settled by the time the merge lands.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gates diff against the base ref

      - name: Use trusted gate scripts from base ref
        # Greptile P1 4140823500 / security: never execute PR-controlled ci/gates/*.py on the
        # shared self-hosted runner. Overlay gate implementations from the PR base (main);
        # the checked-out PR tree remains the data under test (diffs, receipts, paths).
        env:
          # Through env:, never interpolated into the script. The base ref is chosen by
          # whoever opens the pull request, and git permits $, backtick, ( ) and ; in a ref
          # name — so ${{ }} here would substitute a branch called main$(id) into shell
          # source before bash parsed it. Same rule the acting-bot step follows.
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git checkout "origin/$BASE_REF" -- ci/gates/
          echo "Trusted ci/gates overlay from origin/$BASE_REF"
          ls ci/gates/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        run: pip install pyyaml

      - name: Determine the acting bot
        id: bot
        run: |
          # Convention: the branch name is prefixed with the bot id,
          # e.g. bot-03-android/feat-push-notifications
          # or bot-00-programming-lead/desk-model for the orchestrator.
          #
          # Anchored at both ends. An unanchored prefix match accepts bot-01-$(...) and
          # carries it into later steps, where it becomes a shell expansion.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          BOT="${BRANCH%%/*}"
          if [[ ! "$BOT" =~ ^bot-0[0-6]-[a-z0-9-]+$ ]]; then
            echo "::error::Branch '$BRANCH' does not start with a bot id (bot-0N-name/...)."
            echo "::error::G-1 cannot attribute the change without one."
            exit 1
          fi
          echo "bot=$BOT" >> "$GITHUB_OUTPUT"
          echo "Acting bot: $BOT"

      - name: G-1 — Manifest self-check
        run: python3 ci/gates/check_ownership.py --validate-manifest

      - name: G-1 — Path ownership
        env:
          BOT: ${{ steps.bot.outputs.bot }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python3 ci/gates/check_ownership.py \
            --bot "$BOT" \
            --base "origin/$BASE_REF"

      - name: Locate the verification receipt
        id: receipt
        env:
          BOT: ${{ steps.bot.outputs.bot }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # The receipt must be the one THIS change adds, not whichever filename happens
          # to sort first in the bot's directory. Picking the first filename lets an old
          # receipt from an unrelated task satisfy G-2 and G-5/G-6 for a change it never
          # describes — which is the one thing G-2 exists to prevent.
          #
          # One change can add several of a seat's receipts: a rebase or a stack landing
          # replays earlier ones alongside the new one, and they are all "added" relative
          # to the base. `head -n1` then resolved to whichever sorted first, so G-2 read a
          # receipt describing a different task — failing closed when that receipt had no
          # approved_by, but passing on it when it did. So: exactly one candidate is used
          # as-is; several are narrowed by the branch each receipt names; anything still
          # ambiguous stops the build instead of guessing.
          git diff --name-only --diff-filter=d \
            "origin/$BASE_REF...HEAD" -- ".receipts/$BOT" \
            | grep -E '\.json$' > receipts.txt || true
          python3 - <<'SELECT' > receipt.path
          import json, os, sys
          from pathlib import Path

          bot, head = os.environ["BOT"], os.environ.get("HEAD_REF") or ""
          candidates = [p for p in Path("receipts.txt").read_text().split() if p]

          if not candidates:
              sys.exit(
                  f"::error::G-2 — this change adds no verification receipt under .receipts/{bot}/\n"
                  "::error::A completion claim requires a receipt for THIS task, not a previous one.\n"
                  "::error::See skills/verification-receipts/"
              )

          def branch_of(path):
              try:
                  return json.loads(Path(path).read_text()).get("branch")
              except (OSError, ValueError):
                  return None

          if len(candidates) > 1:
              matched = [p for p in candidates if branch_of(p) == head]
              if len(matched) != 1:
                  listing = "\n".join(f"::error::    {p}  (branch: {branch_of(p)!r})" for p in candidates)
                  sys.exit(
                      f"::error::G-2 — this change adds {len(candidates)} receipts under "
                      f".receipts/{bot}/ and {len(matched)} name the branch {head!r}:\n"
                      f"{listing}\n"
                      "::error::Exactly one must name this branch, so the gate reads the receipt for\n"
                      "::error::THIS change rather than one replayed alongside it. Set 'branch' on the\n"
                      "::error::receipt this change is for."
                  )
              candidates = matched

          print(candidates[0])
          SELECT
          RECEIPT=$(cat receipt.path)
          echo "Receipt for this change: $RECEIPT"
          echo "path=$RECEIPT" >> "$GITHUB_OUTPUT"

      - name: G-2 — Verification receipt
        env:
          RECEIPT: ${{ steps.receipt.outputs.path }}
          BOT: ${{ steps.bot.outputs.bot }}
        run: |
          python3 ci/gates/check_receipt.py \
            --receipt "$RECEIPT" \
            --bot "$BOT" \
            --strict

      - name: G-3 — Committed secrets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 ci/gates/check_secrets.py --base "origin/$BASE_REF"

      - name: G-4 — Contract-first changes
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Same rule as the receipt: the change document must be the one THIS change
          # adds. An older, already-valid document would otherwise clear a breaking
          # change it never described.
          CHANGE=$(git diff --name-only --diff-filter=d \
            "origin/$BASE_REF...HEAD" -- contracts/changes \
            | grep -E '\.ya?ml$' | head -n1 || true)
          if [[ -n "$CHANGE" ]]; then
            python3 ci/gates/check_contracts.py \
              --base "origin/$BASE_REF" --change "$CHANGE"
          else
            python3 ci/gates/check_contracts.py --base "origin/$BASE_REF"
          fi

      - name: G-5/G-6 — Rollback and destructive operations
        env:
          RECEIPT: ${{ steps.receipt.outputs.path }}
        run: python3 ci/gates/check_rollback.py --receipt "$RECEIPT"

      - name: G-7 — Desk integrity
        run: python3 ci/gates/check_desk_integrity.py --repo .

  gate-self-test:
    # The gates are only trustworthy if they still block what they claim to block.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Use trusted gate scripts from base ref
        if: github.event_name == 'pull_request'
        # Same trust rule as the gates job: PR-authored gate modules must not run here.
        env:
          # Through env:, never interpolated into the script. The base ref is chosen by
          # whoever opens the pull request, and git permits $, backtick, ( ) and ; in a ref
          # name — so ${{ }} here would substitute a branch called main$(id) into shell
          # source before bash parsed it. Same rule the acting-bot step follows.
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git checkout "origin/$BASE_REF" -- ci/gates/
          echo "Trusted ci/gates overlay from origin/$BASE_REF (gate-self-test)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - name: Gate test suite
        run: python3 -m pytest ci/tests/ -v
