# desk.swcstudio.space — HTTP. Serves only the ACME webroot; everything else is sent to HTTPS.
# certbot certonly --webroot -w /var/www/certbot -d desk.swcstudio.space  (see install-nginx.sh)

server {
    listen 80;
    listen [::]:80;
    server_name desk.swcstudio.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
