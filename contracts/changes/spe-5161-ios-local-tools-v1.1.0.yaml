proposed_by: bot-06-quality-security
surface: contracts/tool-rosters/ios.yaml

breaking: false
version: 1.1.0
previous_version: 1.0.0

summary: >
  Additive: appends 8 desk_ios_* local/MetaVR tools (plist_lint, entitlements_scan,
  spm_test_linux, snapshot_diff, xcodebuild_receipt, device_screenshot, ui_dump, ui_tap) to the
  ios roster, wrapping the Linux-safe CLI added in SPE-5161 / PR #48
  (bot-04-ios/spe-5161-ios-tools-metavr, tip 7dfb11e). No existing tool, field or endpoint is
  renamed or removed; desk_entitlements_diff is unchanged and stays distinct from the new
  desk_ios_entitlements_scan. KNOWN ISSUES (both tracked in the accompanying receipt, neither
  resolved here): (1) the roster now carries 15 own tools, which with the 8 core tools totals
  23 effective tools against ci/gates/check_desk_integrity.py's ROSTER_MAX_TOOLS=15 ceiling
  (G-7); fix is a tool-pack split or raising the ceiling. (2) the 8 new tools' `ios.*` backend
  prefix has no corresponding desk_gateway/tools/ios.py module (services/desk-gateway/** is
  owned by bot-01-systems-backend, confirmed via Greptile review on PR #54); calls will raise
  ModuleNotFoundError until that module is added. Both fixes are out of scope for this change.
  FIXED (Greptile review on PR #54): snapshot_diff, device_screenshot and ui_dump were briefly
  kind: read despite writing an `out` artifact; server.py's call_tool() sets is_error from
  `bool(error) and not spec.read_only`, so a read-kind failure would report as a non-error MCP
  result. Corrected to kind: write for those three.

