# Security PR gate (SPE-5162) — secrets, SAST, SCA on every pull request into main.
#
# Deliberately NOT AutoRedTeam or any other full offensive-security suite. That class of check
# is slow, noisy, and belongs on a schedule (see .github/workflows/security-nightly.yml and
# ci/security/garak-stub.md), never blocking every PR.
#
# Owned by QUALITY (bot-06-quality-security) — see ownership.yaml's "QUALITY narrow override"
# entry for ci/security/** and .github/workflows/security-*.yml.
#
# runs-on matches ci/.github/workflows/gates.yml's own comment: this organisation's
# GitHub-hosted minutes are blocked by a spending limit, so every job here targets the
# self-hosted VPS runner. If that runner is offline this job sits queued rather than failing —
# check the runner before debugging a red/stuck check.
#
# Each scanner runs independently so one tool's finding does not hide another's; each writes a
# SARIF file, all of which are uploaded as a workflow artifact unconditionally (`if: always()`)
# and, best-effort, to code scanning if the repository has Advanced Security enabled — the
# artifact upload is the guaranteed path, the code-scanning upload is a bonus one PR reviewers
# do not need to unblock the gate.

name: Security PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks (secrets)
    runs-on: [self-hosted, Linux, X64]
    # security-events: write is declared per-job, not at the workflow root, per SECURITY.md
    # ("widen permissions one job at a time, never at the workflow root") — each job needs it
    # only for its own optional upload-sarif step below. Uploading to code scanning requires
    # GitHub Advanced Security on a private repo; on a repo without it the step is expected to
    # fail and is marked continue-on-error so it never blocks the gate. The gate itself is
    # enforced by each scanner's own exit code, not by this permission.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the commit range against the base ref

      - name: Fetch base ref
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        # Checkout above is already fetch-depth: 0. Do not pass --depth here.
        # `git fetch --depth=1` writes a shallow boundary at the new base tip and
        # hides every ancestor, even when those objects were already local. Once
        # main has moved past this PR's fork point, origin/$BASE_REF and HEAD have
        # no merge base, so --log-opts="origin/$BASE_REF..HEAD" walks the whole
        # branch and reports fixture tokens this PR never touched. The refspec
        # updates the remote-tracking ref with its history and does not shallow.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Gitleaks — scan only this PR's commits
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        # Scoped to origin/$BASE_REF..HEAD, not the whole repository: a full-history scan hits
        # the intentional fake-secret fixtures in the G-3 gate's own test suite
        # (ci/tests/test_gates.py, services/desk-gateway/tests/test_units.py). Those are
        # pre-existing on main and marked for a different scanner's allowlist convention (see
        # ci/security/gitleaks.toml's comment); scanning only what the PR adds means this gate
        # judges the PR, not the fixtures beneath it.
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . \
            --config ci/security/gitleaks.toml \
            --log-opts="origin/$BASE_REF..HEAD" \
            --report-format sarif --report-path gitleaks.sarif \
            --exit-code 1 \
            -v

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn

      - name: Upload to code scanning (best effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: Semgrep (SAST)
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --baseline-commit below needs the base ref's history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Semgrep — repo rules + registry security/secrets packs
        # --error makes the exit code depend on findings; --severity ERROR keeps the PR gate to
        # HIGH+ equivalent findings per SPE-5162, same intent as bandit's -lll below.
        # Scans the whole repo, not just services/ci: executable code also lives under infra/
        # and web/ (e.g. infra/unified-lsp-broker/broker.py, web/mcp-unified-lsp/server.ts), and
        # a PR gate that skips those isn't "SAST on every PR". Semgrep respects .gitignore on
        # its own (confirmed locally).
        #
        # --baseline-commit scopes blocking findings to what THIS PR changed, same reasoning as
        # gitleaks' --log-opts above: a repo-wide scan on the full tree hits pre-existing findings
        # in code this PR never touches (confirmed locally — the p/security-audit pack flags an
        # existing xml.etree import in scripts/generate-templates.py, owned by a different bot,
        # unrelated to any PR that happens to run this gate next). Without baselining, widening
        # the scan to the whole repo would make every future PR's gate red for code it didn't
        # write. Verified locally: full-tree scan surfaces that 1 pre-existing finding; the same
        # scan with --baseline-commit origin/main against this PR's own diff finds 0.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Same full-history fetch as the gitleaks job. --depth=1 leaves
          # --baseline-commit with no merge base and semgrep exits 2 before it
          # reports any finding.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          semgrep \
            --config ci/security/semgrep.yml \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --severity ERROR --error \
            --baseline-commit "origin/$BASE_REF" \
            .

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

      - name: Upload to code scanning (best effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  bandit:
    name: Bandit (Python SAST)
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base ref's history to build the baseline worktree below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Bandit baseline — snapshot the base ref's own findings
        # A whole-repo `bandit -r .` fails every PR on infra/unified-lsp-broker/broker.py's
        # pre-existing HIGH finding (B324, SHA1 in a WebSocket handshake) — confirmed live on
        # PR #50. An earlier fix scoped Bandit to this PR's changed .py files via `git diff`
        # instead, but that has two real problems a reviewer caught: (1) `mapfile < <(git diff
        # ...)` swallows a git-diff failure silently — bash's `set -e` does not see a process
        # substitution's exit code, so a broken diff produces an empty file list and a false
        # "nothing to scan" pass, fail-open on exactly the tool this gate exists to enforce; and
        # (2) scanning whole changed FILES still re-flags a pre-existing finding if a PR happens
        # to touch broker.py for an unrelated reason.
        #
        # Bandit's own -b/--baseline flag solves both at once: scan the base ref's full tree,
        # scan the current full tree, and let bandit's own finding-fingerprint diff suppress
        # what's already on both sides — no git-diff file-selection at all, so failure mode (1)
        # doesn't exist in this design, and modified-not-new findings in a touched file are
        # exactly what -b is for. The one restriction: -b only works with json/txt/html/custom
        # output, not sarif (confirmed: sarif+baseline together errors out), so this step does
        # the pass/fail decision in JSON and the next step produces the SARIF artifact separately.
        #
        # Relative paths must match between the two scans for bandit's fingerprint match to work,
        # so the baseline scan runs from inside the worktree with `-r .`, not `-r /path/to/worktree`.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          # Same full-history fetch as the gitleaks job. --depth=1 would shallow
          # the base tip this worktree is checked out from.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          # A fixed path (e.g. /tmp/bandit-baseline) collides across runs on this self-hosted
          # runner, which reuses its filesystem between jobs: a cancelled or crashed run can
          # leave the worktree registered, and `git worktree add` on the next PR then fails
          # before Bandit scans anything — confirmed locally (`fatal: already exists`, exit
          # 128), leaving an unrelated PR's security check red until someone cleans it up
          # manually. RUNNER_TEMP plus this run's own id+attempt makes the path unique per run,
          # so no later run can ever collide with a leftover from an earlier one, whether or not
          # runner-level cleanup between jobs happened.
          WORKTREE_DIR="${RUNNER_TEMP}/bandit-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "$WORKTREE_DIR" "origin/$BASE_REF"
          set +e
          (cd "$WORKTREE_DIR" && bandit -r . --ini "$GITHUB_WORKSPACE/ci/security/bandit.ini" -lll -f json -o "$GITHUB_WORKSPACE/bandit-baseline.json")
          baseline_ec=$?
          set -e
          git worktree remove --force "$WORKTREE_DIR"
          # 0 = clean, 1 = findings — both are a successful baseline scan. Anything else (bad
          # args, a crash) means the baseline itself can't be trusted, so fail closed rather
          # than silently comparing against an empty or missing snapshot.
          if [ "$baseline_ec" -gt 1 ]; then
            echo "::error::Bandit baseline scan against origin/$BASE_REF failed (exit $baseline_ec) — refusing to compare against an untrustworthy baseline."
            exit 1
          fi
          python3 -c "import json; json.load(open('bandit-baseline.json'))"

      - name: Bandit — whole repo, HIGH severity only, new findings vs. the base ref
        # -lll raises the reported severity floor to HIGH, matching "fail on HIGH+". This is the
        # step that actually gates the PR: -b suppresses any finding already present on the base
        # ref's tree (per the previous step), so only genuinely new HIGH findings fail the build,
        # regardless of which files changed. Confirmed locally both directions: the pre-existing
        # broker.py finding is suppressed (exit 0); a newly introduced finding in a file that
        # isn't in the baseline at all is still caught (exit 1).
        run: |
          bandit -r . \
            --ini ci/security/bandit.ini \
            -b bandit-baseline.json \
            -lll \
            -f json -o bandit.json

      - name: Bandit — SARIF artifact from the same baselined results
        # -b is incompatible with -f sarif (confirmed), so the SARIF artifact can't come from a
        # single bandit invocation alongside the baseline. Re-running bandit unfiltered for the
        # SARIF would repeat the pre-existing broker.py finding on every PR's report regardless
        # of whether that PR passed or failed — confirmed live on PR #50, and reported as making
        # the artifact useless for spotting what a PR actually introduced. Converting the
        # already-baselined bandit.json from the previous step instead means the SARIF artifact
        # always matches exactly what gated the PR: new findings only, nothing pre-existing.
        if: always()
        run: python3 ci/security/bandit_json_to_sarif.py bandit.json bandit.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif
          path: bandit.sarif
          if-no-files-found: warn

      - name: Upload to code scanning (best effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  dependencies:
    name: pip-audit / Trivy (SCA)
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit — requirements*.txt targets
        # pip-audit reads pip-style requirement files; this repo pins Python deps via
        # services/desk-gateway's uv-managed pyproject.toml, which pip-audit cannot parse as a
        # requirement file (confirmed locally — it errors on the [project] table). Trivy fs
        # below is the SCA path for that manifest. This step covers any requirements*.txt this
        # PR adds and is a no-op, not a false pass, when none exist.
        #
        # pip-audit has no severity flag or threshold at all (checked its full --help): it fails
        # on ANY known vulnerability in a scanned file, not just HIGH+. That's stricter than this
        # gate's stated "fail on HIGH+" policy, not weaker, so it's left as-is rather than
        # papering over a tool gap with a severity filter pip-audit's own data often can't back
        # (CVSS/severity isn't reliably present in PyPI/OSV advisories). Trivy below is the
        # actual HIGH+-filtered SCA gate; treat this step as a stricter supplementary check that
        # only fires once this repo adds a requirements*.txt file.
        run: |
          set -euo pipefail
          pip install pip-audit
          mapfile -t REQ_FILES < <(git ls-files -- 'services/**/requirements*.txt' 'ci/**/requirements*.txt')
          if [ "${#REQ_FILES[@]}" -eq 0 ]; then
            echo "No requirements*.txt under services/ or ci/ — nothing for pip-audit to scan. Skipping."
            exit 0
          fi
          for f in "${REQ_FILES[@]}"; do
            echo "::group::pip-audit $f"
            pip-audit -r "$f"
            echo "::endgroup::"
          done

      - name: Trivy filesystem scan — HIGH+ dependency vulnerabilities
        # v0.28.0 (this workflow's first pin) hardcodes aquasecurity/setup-trivy@v0.2.1, a tag
        # upstream has since deleted — PR #50's own CI caught the resulting "unable to resolve
        # action" failure. v0.36.0 pins its setup-trivy dependency by commit SHA instead of a
        # mutable tag, which is both the fix and the more correct form. This step's own pin is
        # by commit SHA too (the v0.36.0 tag is annotated; this is its peeled commit), per
        # SECURITY.md's "pin what executes by commit SHA, not a mutable tag".
        #
        # ignore-unfixed is deliberately NOT set: this gate's policy is fail on HIGH+, full stop.
        # A HIGH/CRITICAL finding with no fix released yet is still a HIGH/CRITICAL finding —
        # ignore-unfixed would let exactly that class of vulnerability merge silently.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn

      - name: Upload to code scanning (best effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy.sarif
          category: trivy
