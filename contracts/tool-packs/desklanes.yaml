# Tool pack: Desk Lanes (desklanes.lol). Loaded for one ticket via desk_app_tools_load.
# Contract surface (QUALITY); consumers bot-02-web-edge, bot-03-android, bot-04-ios.
version: 1.0.0
app: desklanes
title: Desk Lanes
seats: [web, android, ios]
tools:
  - name: desklanes_api_smoke
    kind: read
    gates: []
    description: Hit the Desk Lanes API health and scoreboard endpoints for one environment and report status, version and latency.
    backend: packs.api_smoke
    input:
      type: object
      additionalProperties: false
      properties:
        environment: { type: string, enum: [staging, production], default: staging }

  - name: desklanes_scoreboard_get
    kind: read
    gates: []
    description: Current lane standings from the Desk Lanes scoreboard endpoint.
    backend: packs.scoreboard_get
    input:
      type: object
      additionalProperties: false
      properties:
        environment: { type: string, enum: [staging, production], default: staging }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }

  - name: desklanes_push_test
    kind: write
    gates: []
    description: Send a test push to a registered Desk Lanes test device. Test devices only.
    backend: packs.push_test
    input:
      type: object
      additionalProperties: false
      required: [platform, device_label]
      properties:
        platform: { type: string, enum: [android, ios] }
        device_label: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
        title: { type: string, maxLength: 80, default: "Desk test push" }
        body: { type: string, maxLength: 200, default: "Sent by the Programming Desk." }

  - name: desklanes_store_listing_get
    kind: read
    gates: []
    description: Current store listing text and assets manifest for the Desk Lanes app on one store.
    backend: packs.store_listing_get
    input:
      type: object
      additionalProperties: false
      required: [store]
      properties:
        store: { type: string, enum: [play, appstore] }
        locale: { type: string, pattern: "^[a-z]{2}(-[A-Z]{2})?$", default: en-AU }

  - name: desklanes_crash_reports
    kind: read
    gates: []
    description: Recent crash groups for the Desk Lanes mobile apps from the configured crash reporter.
    backend: packs.crash_reports
    input:
      type: object
      additionalProperties: false
      properties:
        platform: { type: string, enum: [android, ios] }
        since_hours: { type: integer, minimum: 1, maximum: 720, default: 24 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
